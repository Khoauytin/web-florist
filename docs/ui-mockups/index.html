<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup giao diện quản lý Bích Ngọc Florist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root {
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Neutrals, tinted toward the brand navy (hue 255) */
  --bg: oklch(0.965 0.007 255);
  --surface: oklch(0.99 0.004 255);
  --sunken: oklch(0.945 0.01 255);
  --line: oklch(0.905 0.011 255);
  --line-strong: oklch(0.80 0.02 255);
  --text: oklch(0.26 0.045 255);
  --text-muted: oklch(0.49 0.035 255);

  /* Action */
  --primary: oklch(0.50 0.13 252);
  --primary-hover: oklch(0.44 0.13 252);
  --primary-soft: oklch(0.945 0.03 250);
  --on-primary: oklch(0.99 0.004 255);
  --focus: oklch(0.62 0.15 252);
  --danger: oklch(0.50 0.17 20);
  --danger-soft: oklch(0.955 0.03 20);

  /* Order status pairs: fg / bg */
  --st-new-fg: oklch(0.42 0.06 255);        --st-new-bg: oklch(0.935 0.015 255);
  --st-confirmed-fg: oklch(0.42 0.13 252);  --st-confirmed-bg: oklch(0.94 0.035 250);
  --st-delivering-fg: oklch(0.44 0.11 65);  --st-delivering-bg: oklch(0.945 0.06 80);
  --st-done-fg: oklch(0.38 0.09 155);       --st-done-bg: oklch(0.94 0.04 155);
  --st-cancel-fg: oklch(0.44 0.07 255);     --st-cancel-bg: oklch(0.925 0.012 255);
  --st-failed-fg: oklch(0.42 0.16 28);      --st-failed-bg: oklch(0.945 0.045 28);

  /* Allocation bar */
  --stock: oklch(0.55 0.12 252);
  --made: oklch(0.60 0.12 155);
  --todo: oklch(0.88 0.09 78);
  --todo-line: oklch(0.58 0.13 65);

  /* Scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r: 8px;
  --nav-h: 64px;
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.55 var(--font);
  font-variant-numeric: tabular-nums;
  min-height: 100dvh;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.5rem; line-height: 1.2; font-weight: 600; text-wrap: balance; }
h2 { font-size: 1rem; line-height: 1.3; font-weight: 600; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
img { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--text-muted); }
.small { font-size: 0.875rem; line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: var(--s4); top: -64px; background: var(--primary); color: var(--on-primary); padding: var(--s3) var(--s4); border-radius: var(--r); z-index: 100; }
.skip:focus { top: var(--s2); }

/* ===== Shell ===== */
.app { min-height: 100dvh; }
.main { padding: var(--s4) var(--s4) calc(var(--nav-h) + var(--s8) + env(safe-area-inset-bottom, 0px)); max-width: 1120px; margin: 0 auto; }
.sidebar { display: none; }
.bottomnav {
  position: fixed; inset: auto 0 0 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20;
}
.bottomnav a, .bottomnav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 48px; background: none; border: 0; color: var(--text-muted); font-size: 0.75rem; font-weight: 500; cursor: pointer; text-decoration: none;
  position: relative;
}
.bottomnav [aria-current="page"] { color: var(--primary); font-weight: 600; }
.bottomnav [aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: var(--primary); border-radius: 0 0 var(--r) var(--r); }
.bottomnav .badge-dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r); background: var(--danger); color: var(--on-primary); font-size: 0.75rem; line-height: 18px; text-align: center; font-weight: 600; }

.pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s4); flex-wrap: wrap; }
.pagehead .sub { color: var(--text-muted); font-size: 0.875rem; margin-top: var(--s1); }
.back { display: inline-flex; align-items: center; gap: var(--s1); min-height: 44px; color: var(--text-muted); font-size: 0.875rem; margin-left: calc(-1 * var(--s2)); padding: 0 var(--s2); border-radius: var(--r); }
.back:hover { color: var(--text); text-decoration: none; background: var(--sunken); }

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 248px 1fr; }
  .bottomnav { display: none; }
  .main { padding: var(--s6) var(--s6) var(--s8); width: 100%; }
  .sidebar {
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh;
    background: var(--surface); border-right: 1px solid var(--line); padding: var(--s5) var(--s3);
  }
  .brand { padding: 0 var(--s3) var(--s5); }
  .brand b { display: block; font-size: 1.125rem; font-weight: 700; color: var(--text); letter-spacing: 0; }
  .brand span { font-size: 0.875rem; color: var(--text-muted); }
  .sidebar nav { display: flex; flex-direction: column; gap: var(--s6); }
  .navgroup { display: flex; flex-direction: column; gap: 2px; }
  .navgroup > .navtitle { padding: 0 var(--s3) var(--s2); font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
  .sidebar a.navlink { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s3); border-radius: var(--r); color: var(--text); font-weight: 500; text-decoration: none; transition: background-color 150ms var(--ease); }
  .sidebar a.navlink:hover { background: var(--sunken); }
  .sidebar a.navlink[aria-current="page"] { background: var(--primary-soft); color: var(--primary-hover); font-weight: 600; }
  .sidebar .navlink .count { margin-left: auto; font-size: 0.875rem; font-weight: 600; color: var(--danger); }
  .userbox { margin-top: auto; padding: var(--s3); border-top: 1px solid var(--line); }
  .userbox .who { font-weight: 600; }
  .userbox .role { font-size: 0.875rem; color: var(--text-muted); }
}

/* ===== Controls ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 44px; padding: 0 var(--s4); border-radius: var(--r); border: 1px solid transparent;
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 100ms var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn:hover { text-decoration: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--sunken); }
.btn-ghost { background: none; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }
.btn[disabled] { background: var(--sunken); color: var(--text-muted); border-color: var(--line); cursor: not-allowed; transform: none; }
.btn-block { width: 100%; }

.field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.field label, .label { font-size: 0.875rem; font-weight: 500; }
.field .hint { font-size: 0.875rem; color: var(--text-muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 0 var(--s3); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 1rem;
}
.textarea { padding: var(--s3); min-height: 88px; resize: vertical; line-height: 1.5; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--text-muted); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline-offset: 0; border-color: var(--focus); }
.input-wrap { position: relative; }
.input-wrap .icon { position: absolute; left: var(--s3); top: 12px; color: var(--text-muted); pointer-events: none; }
.input-wrap .input { padding-left: 44px; }
.input-wrap .toggle { position: absolute; right: 4px; top: 0; min-height: 44px; padding: 0 var(--s3); background: none; border: 0; color: var(--primary); font-weight: 600; cursor: pointer; }
.row2 { display: grid; gap: var(--s4); grid-template-columns: 1fr; }
@media (min-width: 640px) { .row2 { grid-template-columns: 1fr 1fr; } }

.chips { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 2px var(--s2); margin: 0 calc(-1 * var(--s4)); padding-inline: var(--s4); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 1024px) { .chips { margin: 0; padding-inline: 2px; flex-wrap: wrap; overflow: visible; } }
.chip {
  flex: none; min-height: 44px; padding: 0 var(--s4); display: inline-flex; align-items: center; gap: var(--s2);
  border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 500; cursor: pointer;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
}
.chip:hover { background: var(--sunken); }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-hover); font-weight: 600; }
.chip .n { font-size: 0.875rem; color: var(--text-muted); }
.chip[aria-pressed="true"] .n { color: var(--primary-hover); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); font-size: 0.875rem; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.st-new { color: var(--st-new-fg); background: var(--st-new-bg); }
.st-confirmed { color: var(--st-confirmed-fg); background: var(--st-confirmed-bg); }
.st-delivering { color: var(--st-delivering-fg); background: var(--st-delivering-bg); }
.st-done { color: var(--st-done-fg); background: var(--st-done-bg); }
.st-cancel { color: var(--st-cancel-fg); background: var(--st-cancel-bg); }
.st-failed { color: var(--st-failed-fg); background: var(--st-failed-bg); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--r); background: var(--sunken); color: var(--text-muted); font-size: 0.875rem; font-weight: 500; }

/* ===== Layout blocks ===== */
.section { margin-top: var(--s6); }
.section > .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel > .pad { padding: var(--s4); }
.divide > * + * { border-top: 1px solid var(--line); }

.stats { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stats > div { padding: var(--s4); border-bottom: 1px solid var(--line); min-width: 0; }
.stats > div:nth-child(odd) { border-right: 1px solid var(--line); }
.stats > div:nth-last-child(-n+2) { border-bottom: 0; }
.stats .v { font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
.stats .l { font-size: 0.875rem; color: var(--text-muted); }
@media (min-width: 1024px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stats > div { border-bottom: 0; border-right: 1px solid var(--line); }
  .stats > div:last-child { border-right: 0; }
  .stats > div:nth-child(odd) { border-right: 1px solid var(--line); }
}

/* Order rows: stacked on phones, columns on desktop */
.olist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; container-type: inline-size; }
.ohead { display: none; }
.orow {
  display: grid; gap: var(--s1) var(--s3); padding: var(--s4); color: inherit; text-decoration: none;
  grid-template-columns: 1fr auto;
  grid-template-areas: "code status" "who who" "prod pay" "total total";
  border-top: 1px solid var(--line); transition: background-color 150ms var(--ease);
}
.orow:first-child { border-top: 0; }
.orow:hover { background: var(--sunken); text-decoration: none; }
.orow .c-code { grid-area: code; font-weight: 600; }
.orow .c-status { grid-area: status; justify-self: end; }
.orow .c-who { grid-area: who; }
.orow .c-prod { grid-area: prod; font-size: 0.875rem; color: var(--text-muted); }
.orow .c-pay { grid-area: pay; font-size: 0.875rem; color: var(--text-muted); justify-self: end; text-align: right; }
.orow .c-total { grid-area: total; font-weight: 600; }
.orow .c-total .pill-label { font-weight: 400; color: var(--text-muted); font-size: 0.875rem; }
@container (min-width: 880px) {
  .ohead, .orow { grid-template-columns: 148px minmax(0, 1fr) 150px 150px 170px 120px; align-items: center; gap: var(--s4); }
  .ohead { display: grid; padding: var(--s3) var(--s4); background: var(--sunken); border-bottom: 1px solid var(--line); font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }
  .orow { grid-template-areas: "code who status prod pay total"; }
  .orow .c-status { justify-self: start; }
  .orow .c-pay { justify-self: start; text-align: left; }
  .orow .c-total { text-align: right; }
}

.mini { display: inline-flex; align-items: center; gap: var(--s2); }
.mini .bar { width: 56px; height: 6px; background: var(--sunken); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.mini .bar i { display: block; height: 100%; background: var(--made); }

/* Stepper (order progress) */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; flex-direction: column; gap: var(--s2); font-size: 0.875rem; color: var(--text-muted); }
.steps li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line-strong); }
.steps li.done::before { background: var(--primary); }
.steps li.now { color: var(--primary-hover); font-weight: 600; }
.steps li.now::before { background: var(--primary); }
.steps li.done { color: var(--text); }
.steps li.skip::before { background: var(--line); }

/* Allocation bar: the signature element */
.alloc { display: flex; height: 12px; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); }
.alloc i { display: block; height: 100%; transition: flex-grow 250ms var(--ease); }
.alloc .a-stock { background: var(--stock); }
.alloc .a-made { background: var(--made); }
.alloc .a-todo { background: var(--todo); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: var(--s2); font-size: 0.875rem; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); border: 1px solid var(--cl, transparent); }
.lg-stock { --c: var(--stock); } .lg-made { --c: var(--made); } .lg-todo { --c: var(--todo); --cl: var(--todo-line); }
.legend b { color: var(--text); font-weight: 600; }

.line { display: grid; gap: var(--s3); padding: var(--s4); grid-template-columns: 64px 1fr; }
.line .thumb { width: 64px; height: 64px; border-radius: var(--r); object-fit: cover; background: var(--sunken); }
.line .thumb.free { display: grid; place-items: center; color: var(--text-muted); border: 1px dashed var(--line-strong); background: var(--surface); font-size: 0.75rem; text-align: center; padding: 4px; }
.line .top { display: flex; justify-content: space-between; gap: var(--s3); }
.line .nm { font-weight: 600; }
.line .meta { font-size: 0.875rem; color: var(--text-muted); }
.line .work { grid-column: 1 / -1; }
@media (min-width: 640px) { .line .work { grid-column: 2; } }

.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
.qty button { width: 44px; height: 44px; background: none; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--text); border-radius: var(--r); }
.qty button:hover { background: var(--sunken); }
.qty button[disabled] { color: var(--line-strong); cursor: not-allowed; background: none; }
.qty output { min-width: 56px; text-align: center; font-weight: 600; }

.kv { display: grid; grid-template-columns: 120px 1fr; gap: var(--s2) var(--s4); padding: var(--s4); font-size: 1rem; }
.kv dt { color: var(--text-muted); font-size: 0.875rem; padding-top: 2px; }
.kv dd { margin: 0; }
.twocol { display: grid; gap: var(--s5); }
@media (min-width: 1024px) { .twocol { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .twocol > aside { position: sticky; top: var(--s6); } }

.money { display: grid; gap: var(--s2); padding: var(--s4); }
.money > div { display: flex; justify-content: space-between; gap: var(--s4); }
.money .total { border-top: 1px solid var(--line); padding-top: var(--s3); margin-top: var(--s1); font-weight: 600; font-size: 1.125rem; }
.money .owe { font-weight: 600; color: var(--danger); }
.money .ok { font-weight: 600; color: var(--st-done-fg); }

.timeline { list-style: none; margin: 0; padding: var(--s4); display: grid; gap: var(--s4); }
.timeline li { display: grid; grid-template-columns: 8px 1fr; gap: var(--s3); font-size: 0.875rem; }
.timeline li::before { content: ""; width: 8px; height: 8px; margin-top: 7px; border-radius: 2px; background: var(--line-strong); }
.timeline .when { color: var(--text-muted); }

.notice { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--st-delivering-bg); color: var(--st-delivering-fg); font-size: 0.875rem; font-weight: 500; }
.notice.info { background: var(--primary-soft); color: var(--primary-hover); }

.actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.actions .why { font-size: 0.875rem; color: var(--text-muted); flex-basis: 100%; }

/* Products */
.pgrid { display: grid; gap: var(--s3); grid-template-columns: 1fr; }
@media (min-width: 640px) { .pgrid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .pgrid { grid-template-columns: repeat(3, 1fr); } }
.pcard { display: grid; grid-template-columns: 96px 1fr; gap: var(--s3); padding: var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color 150ms var(--ease); }
.pcard:hover { border-color: var(--line-strong); text-decoration: none; }
.pcard img { width: 96px; height: 120px; object-fit: cover; border-radius: var(--r); background: var(--sunken); }
.pcard .nm { font-weight: 600; line-height: 1.3; }
.pcard .code { font-size: 0.875rem; color: var(--text-muted); }
.pcard .price { font-weight: 600; margin-top: var(--s1); }
.stocktrio { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: var(--s4); margin-top: var(--s2); font-size: 0.875rem; color: var(--text-muted); }
.stocktrio b { display: block; font-size: 1rem; color: var(--text); }
.stocktrio .avail b { color: var(--primary-hover); }
.stocktrio .zero b { color: var(--danger); }

.bigtrio { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.bigtrio > div { padding: var(--s4); }
.bigtrio > div + div { border-left: 1px solid var(--line); }
.bigtrio .v { font-size: 2rem; font-weight: 600; line-height: 1.1; }
.bigtrio .l { font-size: 0.875rem; color: var(--text-muted); }
.bigtrio .main .v { color: var(--primary-hover); }

.pdetail { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1fr); }
.pdetail > * { min-width: 0; }
@media (min-width: 1024px) { .pdetail { grid-template-columns: 320px minmax(0, 1fr); align-items: start; } }
.pdetail .photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--r); background: var(--sunken); }

.tbl { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--text-muted); padding: var(--s3) var(--s4); background: var(--sunken); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:first-child td { border-top: 0; }

}

        <div class="ghead"><img src="${IMG}${PRODUCTS[sku].img}" alt="" width="56" height="56" loading="lazy"><div><h2>${PRODUCTS[sku].name}</h2><div class="small muted">${sku}</div></div>
          <div class="left num">${remainingQty}<small>còn phải làm</small></div></div>
        ${rows.map(({ id, k, l }) => { const o = ORDERS[id]; return `<div class="prow"><div class="top"><div><a href="#/order/${id}"><b>${o.code}</b></a> · ${esc(o.rname)}<div class="small muted">Giao ${o.date} · ${o.time}</div></div><div class="small muted">Đặt ${l.qty}, lấy kho ${l.stock}</div></div>
          ${allocBar(l, o)}<div class="ctl">${stepper(id, k, l)}<button class="btn btn-secondary" type="button" data-act="made" data-o="${id}" data-i="${k}" data-d="all" ${l.made >= l.make ? 'disabled' : ''}>Làm xong hết</button></div></div>`; }).join('')}</section>`;
    }).join('');
    return `<div class="pagehead"><div><h1>Sản xuất</h1><p class="sub">Việc cần làm từ các đơn đã xác nhận.</p></div></div>
      <div class="chips" role="group" aria-label="Lọc theo ngày giao"><button class="chip" type="button" aria-pressed="true" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Tất cả</button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Giao hôm nay</button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Giao ngày mai</button></div>
      ${html || '<div class="panel pad"><p>Chưa có việc cần làm. Khi một đơn được xác nhận và cần làm thêm, việc sẽ hiện ở đây.</p></div>'}`;
  },

  products() {
    const cards = Object.entries(PRODUCTS).map(([sku, p]) => {
      const av = p.onHand - p.reserved;
      const trio = p.mode === 'Làm theo đơn' ? `<p class="small muted" style="margin-top:8px">Làm theo đơn, không dùng tồn kho</p>`
        : `<div class="stocktrio"><div>Đang có<b>${p.onHand}</b></div><div>Đã giữ<b>${p.reserved}</b></div><div class="avail ${av === 0 ? 'zero' : ''}">Sẵn sàng bán<b>${av}</b></div></div>`;
      return `<a class="pcard" href="#/product/${sku}"><img src="${IMG}${p.img}" alt="${p.name}" width="96" height="120" loading="lazy">
        <div><div class="nm">${p.name}</div><div class="code">${sku} · ${p.cat}</div><div class="price num">${fmt(p.price)}</div>${trio}
        ${p.mode === 'Có sẵn' && av === 0 ? '<span class="tag" style="margin-top:8px">Hết hàng</span>' : `<span class="tag" style="margin-top:8px">${p.mode}</span>`}</div></a>`;
    }).join('');
    return `<div class="pagehead"><h1>Sản phẩm</h1><button class="btn btn-primary" type="button" data-owner-only data-act="toast" data-msg="Thêm sản phẩm: mã, tên, danh mục, giá, ảnh">${icon('plus')}Thêm sản phẩm</button></div>
      <div class="field" style="margin-bottom:12px"><label class="sr" for="sq">Tìm sản phẩm</label><div class="input-wrap">${icon('search')}<input class="input" id="sq" type="search" placeholder="Tìm theo tên hoặc mã sản phẩm"></div></div>
      <div class="chips" role="group" aria-label="Lọc theo danh mục"><button class="chip" type="button" aria-pressed="true" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Tất cả<span class="n">7</span></button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Hoa bó<span class="n">4</span></button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Hoa hộp<span class="n">1</span></button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Hoa giỏ<span class="n">1</span></button><button class="chip" type="button" aria-pressed="false" data-act="toast" data-msg="Bộ lọc hoạt động trong ứng dụng thật">Hoa lồng đèn<span class="n">1</span></button></div>
      <div class="pgrid" style="margin-top:12px">${cards}</div>`;
  },

  product(sku) {
    const p = PRODUCTS[sku || 'BO-001']; sku = sku || 'BO-001'; if (!p) return '<p>Không tìm thấy sản phẩm.</p>';
    const av = p.onHand - p.reserved;
    return `<a class="back" href="#/products">${icon('back')}Sản phẩm</a>
      <div class="pagehead" style="margin-top:4px"><div><h1>${p.name}</h1><p class="sub">${sku} · ${p.cat}</p></div>
        <div class="actions"><button class="btn btn-primary" type="button" data-act="toast" data-msg="Nhập thêm hàng làm sẵn: số lượng, ghi chú">${icon('plus')}Nhập thêm hàng làm sẵn</button>
        <button class="btn btn-secondary" type="button" data-owner-only data-act="toast" data-msg="Điều chỉnh tồn kho cần ghi lý do">Điều chỉnh tồn kho</button>
        <button class="btn btn-secondary" type="button" data-owner-only data-act="toast" data-msg="Sửa sản phẩm">Sửa sản phẩm</button></div></div>
      <div class="pdetail"><img class="photo" src="${IMG}${p.img}" alt="${p.name}" width="640" height="800">
        <div style="display:grid; gap:24px; grid-template-columns:minmax(0,1fr)">
          ${p.mode === 'Làm theo đơn' ? '<div class="notice info">' + icon('info') + '<span>Sản phẩm làm theo đơn nên không dùng tồn kho. Số lượng cần làm được tính trên từng đơn.</span></div>' : `
          <div><div class="bigtrio"><div><div class="v num">${p.onHand}</div><div class="l">Đang có</div></div><div><div class="v num">${p.reserved}</div><div class="l">Đã giữ cho đơn</div></div><div class="main"><div class="v num">${av}</div><div class="l">Sẵn sàng bán</div></div></div>
          <p class="small muted" style="margin-top:8px">Sẵn sàng bán = Đang có - Đã giữ cho đơn</p></div>`}
          <dl class="panel kv" style="margin:0"><dt>Giá bán</dt><dd class="num">${fmt(p.price)}</dd><dt data-owner-only>Giá vốn</dt><dd class="num" data-owner-only>${fmt(p.cost)}</dd><dt>Phương thức</dt><dd>${p.mode}</dd><dt>Trạng thái</dt><dd>Đang bán</dd></dl>
          <section aria-labelledby="h-mv"><div class="head" style="margin-bottom:12px"><h2 id="h-mv">Lịch sử tồn kho</h2></div>
            <div class="panel scroll"><table class="tbl"><thead><tr><th>Thời gian</th><th>Loại</th><th class="r">SL</th><th class="r">Đang có</th><th class="r">Đã giữ</th><th>Người làm</th><th>Đơn hoặc lý do</th></tr></thead>
            <tbody>${MOVES.map(m => `<tr><td>${m[0]}</td><td>${m[1]}</td><td class="r num">${m[2]}</td><td class="r num">${m[3]}</td><td class="r num">${m[4]}</td><td>${m[5]}</td><td>${m[6]}</td></tr>`).join('')}</tbody></table></div></section>
        </div></div>`;
  },

  customers() {
    return `<div class="pagehead"><h1>Khách hàng</h1><button class="btn btn-primary" type="button" data-act="toast" data-msg="Thêm khách hàng">${icon('plus')}Thêm khách</button></div>
      <div class="field" style="margin-bottom:12px"><label class="sr" for="cq">Tìm khách</label><div class="input-wrap">${icon('search')}<input class="input" id="cq" type="search" inputmode="search" placeholder="Tìm theo số điện thoại hoặc tên"></div></div>
      <div class="panel scroll"><table class="tbl"><thead><tr><th>Khách hàng</th><th>Số điện thoại</th><th class="r">Số đơn</th><th class="r">Tổng tiền</th><th>Mua gần nhất</th></tr></thead>
      <tbody>${CUSTOMERS.map(c => `<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td class="r num">${c[2]}</td><td class="r num">${fmt(c[3])}</td><td>${c[4]}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:12px">Số đơn và tổng tiền chỉ tính các đơn đã hoàn thành.</p>`;
  },

  exports() {
    return `<div class="pagehead"><div><h1>Xuất Excel</h1><p class="sub">Tạo một file .xlsx gồm 5 sheet theo bộ lọc bên dưới.</p></div></div>
      <div style="display:grid; gap:24px; max-width:760px">
        <div class="row2"><div class="field"><label for="d1">Từ ngày</label><input class="input" id="d1" type="date" value="2026-10-01"></div><div class="field"><label for="d2">Đến ngày</label><input class="input" id="d2" type="date" value="2026-10-31"></div></div>
        <div class="field"><span class="label" id="by">Tính theo</span><div class="seg" role="group" aria-labelledby="by"><button type="button" aria-pressed="true" data-act="seg">Ngày giao</button><button type="button" aria-pressed="false" data-act="seg">Ngày tạo đơn</button></div></div>
        <div class="field"><span class="label" id="stt">Trạng thái đơn</span><div class="chips" style="margin:0;padding-inline:2px" role="group" aria-labelledby="stt">${Object.values(STATUS).map((s, i) => `<button class="chip" type="button" aria-pressed="${i === 3}" data-act="chip">${s[0]}</button>`).join('')}</div><span class="hint">Doanh thu trong sheet Tổng hợp chỉ tính đơn Hoàn thành.</span></div>
        <div class="row2"><div class="field"><label for="dm">Danh mục</label><select class="select" id="dm"><option>Tất cả danh mục</option><option>Hoa bó</option><option>Hoa hộp</option></select></div><div class="field"><label for="kh">Khách hàng</label><select class="select" id="kh"><option>Tất cả khách</option><option>Lê Thị Lan</option></select></div></div>
        <div class="panel"><div class="pad"><h2 style="margin-bottom:8px">File sẽ gồm</h2><ul class="small" style="margin:0; padding-left:20px; display:grid; gap:4px"><li>Tổng hợp: số đơn, doanh thu, đã thu, còn phải thu</li><li>Danh sách đơn hàng</li><li>Chi tiết sản phẩm trong từng đơn</li><li>Khách hàng</li><li>Sản phẩm và tồn kho</li></ul></div></div>
        <div><button class="btn btn-primary" type="button" data-act="toast" data-msg="Tải file bao-cao-2026-10-01-2026-10-31.xlsx (mockup)">${icon('download')}Xuất Excel</button></div>
      </div>`;
  },

  staff() {
    const rows = [['Ngọc Bích', 'ngocbich', 'Chủ shop', 'Đang hoạt động', 'Hôm nay 07:58'], ['Thu Trang', 'thutrang', 'Nhân viên', 'Đang hoạt động', 'Hôm nay 08:03'], ['Anh Hưng', 'anhhung', 'Nhân viên', 'Đã khóa', '12/10/2026']];
    return `<div class="pagehead"><div><h1>Nhân viên</h1><p class="sub">Tạo tài khoản, đặt lại mật khẩu, khóa khi nghỉ việc.</p></div><button class="btn btn-primary" type="button" data-act="toast" data-msg="Thêm nhân viên: tên, tên đăng nhập, mật khẩu tạm">${icon('plus')}Thêm nhân viên</button></div>
      <div class="panel scroll"><table class="tbl"><thead><tr><th>Tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th><span class="sr">Thao tác</span></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3] === 'Đã khóa' ? '<span class="badge st-cancel">Đã khóa</span>' : '<span class="badge st-done">Đang hoạt động</span>'}</td><td>${r[4]}</td>
        <td class="right">${r[2] === 'Chủ shop' ? '' : `<button class="btn btn-ghost" type="button" data-act="toast" data-msg="Đặt lại mật khẩu">Đặt lại mật khẩu</button><button class="btn btn-ghost" type="button" data-act="toast" data-msg="${r[3] === 'Đã khóa' ? 'Mở khóa' : 'Khóa tài khoản và hủy phiên đăng nhập'}">${r[3] === 'Đã khóa' ? 'Mở khóa' : 'Khóa'}</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  }
};

/* ===== Vẽ và sự kiện ===== */
const TITLES = { login: 'Đăng nhập', today: 'Hôm nay', orders: 'Đơn hàng', order: 'Chi tiết đơn', 'order-new': 'Tạo đơn mới', production: 'Sản xuất', products: 'Sản phẩm', product: 'Chi tiết sản phẩm', customers: 'Khách hàng', exports: 'Xuất Excel', staff: 'Nhân viên' };
function render() {
  const r = route();
  if (!VIEWS[r.name]) { location.hash = '#/today'; return; }
  document.body.dataset.role = role;
  const html = VIEWS[r.name](r.arg);
  $('#root').innerHTML = r.name === 'login' ? html : shell(r, html);
  document.title = `${TITLES[r.name]} - Bích Ngọc Florist`;
  window.scrollTo(0, 0);
  const staffBlocked = role === 'staff' && ['exports', 'staff'].includes(r.name);
  if (staffBlocked) $('#view').innerHTML = `<div class="panel pad" style="margin-top:16px"><h1 style="margin-bottom:8px">Bạn không có quyền xem trang này</h1><p class="muted" style="margin-bottom:16px">Trang này chỉ dành cho chủ shop.</p><a class="btn btn-secondary" href="#/today">Về trang Hôm nay</a></div>`;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'role') { role = b.dataset.role; render(); }
  else if (a === 'made') {
    const l = ORDERS[b.dataset.o].lines[+b.dataset.i];
    l.made = b.dataset.d === 'all' ? l.make : Math.max(0, Math.min(l.make, l.made + +b.dataset.d));
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (a === 'toast') toast(b.dataset.msg);
  else if (a === 'more') {
    $('#more-body').innerHTML = `<a href="#/customers">${icon('users')}Khách hàng</a>` + (role === 'owner' ? `<a href="#/exports">${icon('download')}Xuất Excel</a><a href="#/staff">${icon('shield')}Nhân viên</a>` : '') + `<a href="#/login">${icon('out')}Đăng xuất</a>`;
    $('#more-sheet').showModal();
  }
  else if (a === 'close-sheet') $('#more-sheet').close();
  else if (a === 'seg') { b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  else if (a === 'chip') b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
  else if (a === 'pw') { const i = b.previousElementSibling; const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Ẩn' : 'Hiện'; }
});
$('#more-sheet').addEventListener('click', e => { if (e.target.closest('a') || e.target === e.currentTarget) $('#more-sheet').close(); });
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '#/login';
render();
</script>
</body>
</html>
